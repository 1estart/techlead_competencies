[project]
name = "sport-events-dwh"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Artemiy", email = "artem.pospelov2018@yandex.ru" }
]
requires-python = ">=3.14"
dependencies = [
    "apache-airflow>=3.3.2",
    "fastapi>=0.136.3",
    "great-expectations>=1.24.1",
    "kafka-python>=3.0.12",
    "pandas>=3.1.0",
    "polars>=2.1.0",
    "psycopg2-binary>=2.9.13",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "uvicorn>=0.54.0",
]

[project.scripts]
sport-events-dwh = "sport_events_dwh:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
