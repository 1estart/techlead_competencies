apiVersion: v1
kind: Namespace
metadata:
  name: spark-demo

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: spark
  namespace: spark-demo

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: spark-demo
  name: spark-role
rules:
- apiGroups: [""]
  resources:
  - pods
  - pods/log
  - services
  - configmaps
  - serviceaccounts
  - events
  verbs:
  - create
  - get
  - list
  - watch
  - update
  - patch
  - delete

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: spark-role-binding
  namespace: spark-demo
subjects:
- kind: ServiceAccount
  name: spark
  namespace: spark-demo
roleRef:
  kind: Role
  name: spark-role
  apiGroup: rbac.authorization.k8s.io
