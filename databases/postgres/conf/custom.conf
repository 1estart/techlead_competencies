# ============================================================
# Настройка: Логирование всех SQL-запросов
# ============================================================
# Что делает:
#   Записывает ВСЕ выполняемые SQL-запросы в лог сервера.
#
# Зачем:
#   - Аудит: кто и какие запросы выполнял
#   - Отладка: видно медленные или ошибочные запросы
#   - Безопасность: контроль доступа к данным
#
# Значения:
#   'none'  - не логировать (по умолчанию)
#   'ddl'   - только DDL (CREATE, ALTER, DROP)
#   'mod'   - DDL + DML (INSERT, UPDATE, DELETE)
#   'all'   - ВСЕ запросы (включая SELECT)
#
# Влияние на производительность:
#   'all' увеличивает нагрузку на диск.
#   В продакшене лучше использовать 'mod' или 'ddl'.
#   Для отладки и аудита - 'all'.
# ============================================================

log_statement = 'all'

# Дополнительно: логируем запросы дольше 100мс
log_min_duration_statement = 100

# Куда писать логи
log_destination = 'stderr'
logging_collector = off